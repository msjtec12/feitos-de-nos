<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 36" fill="none">
  <!-- Barra de trilha pixelada em degraus com gema cúbica central -->
  <g fill="#166534">
    <rect x="20" y="14" width="120" height="8"/>
    <rect x="220" y="14" width="120" height="8"/>
  </g>
  <g fill="#4ADE80">
    <rect x="20" y="14" width="120" height="2"/>
    <rect x="220" y="14" width="120" height="2"/>
  </g>
  <g fill="#052E16">
    <rect x="20" y="20" width="120" height="2"/>
    <rect x="220" y="20" width="120" height="2"/>
  </g>

  <!-- Gema de diamante / esmeralda cúbica no centro -->
  <g transform="translate(180, 18)">
    <polygon points="0,-14 14,0 0,14 -14,0" fill="#38BDF8" stroke="#0369A1" stroke-width="2"/>
    <polygon points="0,-14 14,0 0,0 -14,0" fill="#BAE6FD" opacity="0.8"/>
  </g>
</svg>
