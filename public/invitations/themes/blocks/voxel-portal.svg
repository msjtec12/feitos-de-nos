<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none">
  <defs>
    <!-- Gradiente do vórtice de portal de blocos -->
    <radialGradient id="portalVortex" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#6B21A8"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </radialGradient>
    <filter id="portalShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#052E16" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Moldura de portal construído em blocos de pedra e musgo -->
  <g filter="url(#portalShadow)">
    <!-- Moldura de blocos externos -->
    <rect x="20" y="20" width="280" height="400" fill="#334155" stroke="#0F172A" stroke-width="6"/>

    <!-- Blocos individuais estilizados na moldura -->
    <!-- Coluna esquerda -->
    <rect x="20" y="20" width="50" height="50" fill="#475569" stroke="#1E293B" stroke-width="2"/>
    <rect x="20" y="70" width="50" height="50" fill="#334155" stroke="#1E293B" stroke-width="2"/>
    <rect x="20" y="120" width="50" height="50" fill="#22C55E" opacity="0.3"/>
    <rect x="20" y="170" width="50" height="50" fill="#475569" stroke="#1E293B" stroke-width="2"/>
    <rect x="20" y="220" width="50" height="50" fill="#334155" stroke="#1E293B" stroke-width="2"/>
    <rect x="20" y="270" width="50" height="50" fill="#475569" stroke="#1E293B" stroke-width="2"/>
    <rect x="20" y="320" width="50" height="50" fill="#334155" stroke="#1E293B" stroke-width="2"/>
    <rect x="20" y="370" width="50" height="50" fill="#475569" stroke="#1E293B" stroke-width="2"/>

    <!-- Coluna direita -->
    <rect x="250" y="20" width="50" height="50" fill="#475569" stroke="#1E293B" stroke-width="2"/>
    <rect x="250" y="70" width="50" height="50" fill="#334155" stroke="#1E293B" stroke-width="2"/>
    <rect x="250" y="120" width="50" height="50" fill="#475569" stroke="#1E293B" stroke-width="2"/>
    <rect x="250" y="170" width="50" height="50" fill="#22C55E" opacity="0.3"/>
    <rect x="250" y="220" width="50" height="50" fill="#475569" stroke="#1E293B" stroke-width="2"/>
    <rect x="250" y="270" width="50" height="50" fill="#334155" stroke="#1E293B" stroke-width="2"/>
    <rect x="250" y="320" width="50" height="50" fill="#475569" stroke="#1E293B" stroke-width="2"/>
    <rect x="250" y="370" width="50" height="50" fill="#334155" stroke="#1E293B" stroke-width="2"/>

    <!-- Topo e base -->
    <rect x="70" y="20" width="180" height="50" fill="#334155" stroke="#1E293B" stroke-width="2"/>
    <rect x="70" y="370" width="180" height="50" fill="#334155" stroke="#1E293B" stroke-width="2"/>

    <!-- Interior do portal com energia translúcida cúbica -->
    <rect x="70" y="70" width="180" height="300" fill="url(#portalVortex)" stroke="#A855F7" stroke-width="4"/>
    <!-- Pixels de energia flutuando dentro do portal -->
    <rect x="110" y="120" width="14" height="14" fill="#E9D5FF" opacity="0.8"/>
    <rect x="180" y="160" width="20" height="20" fill="#C084FC" opacity="0.7"/>
    <rect x="130" y="220" width="16" height="16" fill="#F472B6" opacity="0.8"/>
    <rect x="170" y="280" width="12" height="12" fill="#E9D5FF" opacity="0.9"/>
    <rect x="90" y="260" width="18" height="18" fill="#A855F7" opacity="0.6"/>

    <!-- Botão pixelado de ativação no centro do portal -->
    <rect x="90" y="195" width="140" height="50" fill="#15803D" stroke="#052E16" stroke-width="4"/>
    <rect x="94" y="199" width="132" height="6" fill="#4ADE80"/>
    <text x="160" y="228" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="900" font-family="monospace">
      ENTRAR NO PORTAL
    </text>
  </g>
</svg>
