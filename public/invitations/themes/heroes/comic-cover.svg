<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none">
  <defs>
    <filter id="comicCoverShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#0F172A" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Capa de revista em quadrinhos clássica #1 -->
  <g filter="url(#comicCoverShadow)">
    <rect x="15" y="15" width="290" height="410" rx="14" fill="#FEF08A" stroke="#0F172A" stroke-width="6"/>

    <!-- Caixa de cabeçalho Comic Book -->
    <rect x="15" y="15" width="290" height="75" rx="10" fill="#DC2626" stroke="#0F172A" stroke-width="5"/>
    
    <!-- Selo de aprovação do código de quadrinhos (Comic Code) -->
    <rect x="25" y="25" width="45" height="52" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <text x="47" y="44" text-anchor="middle" fill="#0F172A" font-size="9" font-weight="900" font-family="sans-serif">EDIÇÃO</text>
    <text x="47" y="66" text-anchor="middle" fill="#DC2626" font-size="20" font-weight="900" font-family="sans-serif">#1</text>

    <!-- Título de revista -->
    <text x="175" y="58" text-anchor="middle" fill="#FACC15" font-size="28" font-weight="900" font-family="Impact, sans-serif" stroke="#0F172A" stroke-width="1.8" letter-spacing="1">
      SUPER AVENTURA
    </text>

    <!-- Retículas Halftone no fundo da capa -->
    <g fill="#FDE047" opacity="0.6">
      <circle cx="50" cy="120" r="4"/><circle cx="70" cy="120" r="4"/><circle cx="90" cy="120" r="4"/>
      <circle cx="50" cy="140" r="4"/><circle cx="70" cy="140" r="4"/><circle cx="90" cy="140" r="4"/>
      <circle cx="230" cy="120" r="4"/><circle cx="250" cy="120" r="4"/><circle cx="270" cy="120" r="4"/>
    </g>

    <!-- Grande explosão de ação no centro: "CONVITE OFICIAL" -->
    <polygon points="160,110 185,150 240,135 210,180 265,210 205,230 220,285 160,250 100,285 115,230 55,210 110,180 80,135 135,150" 
             fill="#2563EB" 
             stroke="#0F172A" 
             stroke-width="5"/>
    <polygon points="160,125 180,160 225,148 200,185 245,210 195,225 208,270 160,240 112,270 125,225 75,210 120,185 95,148 140,160" 
             fill="#FACC15" 
             stroke="#0F172A" 
             stroke-width="3"/>

    <text x="160" y="200" text-anchor="middle" fill="#DC2626" font-size="22" font-weight="900" font-family="Impact, sans-serif" stroke="#0F172A" stroke-width="1.2">
      MISSÃO ESPECIAL!
    </text>

    <!-- Skyline da cidade na base da capa -->
    <path d="M 25 390 L 55 350 L 75 350 L 75 370 L 105 330 L 135 330 L 135 365 L 165 315 L 195 315 L 195 360 L 225 340 L 255 340 L 255 375 L 295 355 L 295 390 Z" 
          fill="#1E293B" 
          stroke="#0F172A" 
          stroke-width="3"/>
    
    <!-- Faixa inferior da capa -->
    <rect x="25" y="390" width="270" height="25" fill="#DC2626" stroke="#0F172A" stroke-width="3"/>
    <text x="160" y="407" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="900" letter-spacing="1.5" font-family="sans-serif">
      TOQUE PARA ABRIR A REVISTA
    </text>
  </g>
</svg>
