<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none">
  <defs>
    <filter id="comicShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#0F172A" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Emblema de escudo heroico estilo quadrinhos com borda preta espessa -->
  <g filter="url(#comicShadow)">
    <!-- Escudo externo amarelo ouro -->
    <path d="M 60 10 
             L 105 24 
             C 105 70, 85 105, 60 125 
             C 35 105, 15 70, 15 24 
             L 60 10 Z" 
          fill="#FACC15" 
          stroke="#0F172A" 
          stroke-width="5" 
          stroke-linejoin="round"/>

    <!-- Escudo interno azul heróico vibrante -->
    <path d="M 60 20 
             L 95 31 
             C 95 68, 78 98, 60 114 
             C 42 98, 25 68, 25 31 
             L 60 20 Z" 
          fill="#1D4ED8" 
          stroke="#0F172A" 
          stroke-width="3" 
          stroke-linejoin="round"/>

    <!-- Estrela heroica branca e vermelha central -->
    <polygon points="60,34 68,52 88,52 72,64 78,84 60,72 42,84 48,64 32,52 52,52" 
             fill="#DC2626" 
             stroke="#FFFFFF" 
             stroke-width="2.5" 
             stroke-linejoin="round"/>
    <circle cx="60" cy="58" r="6" fill="#FACC15" stroke="#0F172A" stroke-width="1.5"/>
  </g>
</svg>
