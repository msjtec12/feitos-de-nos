<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none">
  <defs>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cardInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Carta colecionável mística elemental para abertura -->
  <g filter="url(#cardGlow)">
    <!-- Borda externa holográfica/dourada -->
    <rect x="15" y="15" width="290" height="410" rx="24" fill="url(#cardBorder)" stroke="#FDE68A" stroke-width="4"/>
    <rect x="25" y="25" width="270" height="390" rx="18" fill="url(#cardInner)"/>

    <!-- Padrão geométrico cósmico da carta -->
    <circle cx="160" cy="180" r="85" stroke="#FDE68A" stroke-width="2" stroke-dasharray="6 4" opacity="0.4"/>
    <circle cx="160" cy="180" r="110" stroke="#F59E0B" stroke-width="1.5" opacity="0.25"/>

    <!-- Selo central dos 4 elementos -->
    <g transform="translate(160, 180)">
      <!-- Fogo (Norte) -->
      <path d="M 0 -20 C 12 -45, -12 -55, 0 -75 C 15 -50, 25 -40, 0 -20 Z" fill="#EF4444"/>
      <!-- Água (Sul) -->
      <path d="M 0 20 C 15 40, 10 65, 0 75 C -10 65, -15 40, 0 20 Z" fill="#0284C7"/>
      <!-- Terra / Folha (Oeste) -->
      <path d="M -20 0 C -45 12, -65 0, -75 0 C -65 -15, -45 -10, -20 0 Z" fill="#10B981"/>
      <!-- Energia / Trovão (Leste) -->
      <polygon points="20,-8 45,-18 36,0 68,0 26,18 35,4" fill="#F59E0B"/>

      <!-- Orbe central brilhante -->
      <circle cx="0" cy="0" r="22" fill="#FEF08A" stroke="#B45309" stroke-width="3"/>
      <circle cx="0" cy="0" r="16" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- Banner inferior de carta lendária -->
    <rect x="45" y="340" width="230" height="45" rx="12" fill="#78350F" stroke="#FDE68A" stroke-width="2"/>
    <text x="160" y="368" text-anchor="middle" fill="#FEF08A" font-size="14" font-weight="900" letter-spacing="2" font-family="sans-serif">
      CARTA LENDÁRIA OFICIAL
    </text>
  </g>
</svg>
