<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none">
  <defs>
    <!-- Gradiente de cristal facetado elemental -->
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB"/>
      <stop offset="25%" stopColor="#FDE68A"/>
      <stop offset="60%" stopColor="#F59E0B"/>
      <stop offset="100%" stopColor="#B45309"/>
    </linearGradient>
    <radialGradient id="crystalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FDE047" stop-opacity="0.8"/>
      <stop offset="60%" stopColor="#F97316" stop-opacity="0.3"/>
      <stop offset="100%" stopColor="#F97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="elementalGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#EA580C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Brilho místico ao redor do cristal -->
  <circle cx="60" cy="70" r="55" fill="url(#crystalGlow)"/>

  <!-- Moldura de insígnia / medalha hexagonal com bisel dourado -->
  <g filter="url(#elementalGlow)">
    <!-- Base hexagonal externa -->
    <polygon points="60,10 106,36 106,94 60,120 14,94 14,36" 
             fill="#78350F" 
             stroke="#FDE68A" 
             stroke-width="3" 
             stroke-linejoin="round"/>

    <!-- Facetas do cristal místico central -->
    <polygon points="60,16 98,38 98,90 60,112 22,90 22,38" 
             fill="url(#crystalGrad)"/>

    <!-- Faceta superior com reflexo -->
    <polygon points="60,16 98,38 60,48 22,38" fill="#FFFBEB" opacity="0.65"/>
    <!-- Faceta esquerda -->
    <polygon points="22,38 60,48 60,88 22,90" fill="#F59E0B" opacity="0.35"/>
    <!-- Faceta direita -->
    <polygon points="98,38 60,48 60,88 98,90" fill="#B45309" opacity="0.4"/>
    <!-- Faceta inferior -->
    <polygon points="60,88 98,90 60,112 22,90" fill="#78350F" opacity="0.5"/>

    <!-- Quatro gemas elementais nos vértices -->
    <!-- Fogo (Topo) -->
    <circle cx="60" cy="16" r="5" fill="#EF4444" stroke="#FEF08A" stroke-width="1.5"/>
    <!-- Água (Direita) -->
    <circle cx="98" cy="38" r="4.5" fill="#0284C7" stroke="#BAE6FD" stroke-width="1.5"/>
    <!-- Natureza (Esquerda) -->
    <circle cx="22" cy="38" r="4.5" fill="#16A34A" stroke="#BBF7D0" stroke-width="1.5"/>
    <!-- Energia (Base) -->
    <circle cx="60" cy="112" r="5" fill="#EAB308" stroke="#FEF9C3" stroke-width="1.5"/>
  </g>
</svg>
