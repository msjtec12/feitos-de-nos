<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none">
  <defs>
    <!-- Gradiente da madeira rústica de expedição -->
    <linearGradient id="crateWoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C4803E"/>
      <stop offset="25%" stop-color="#9C5A20"/>
      <stop offset="75%" stop-color="#784013"/>
      <stop offset="100%" stop-color="#502809"/>
    </linearGradient>
    <linearGradient id="crateSignWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DE9B52"/>
      <stop offset="50%" stop-color="#B86F28"/>
      <stop offset="100%" stop-color="#804510"/>
    </linearGradient>
    <linearGradient id="ironBandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E3440"/>
      <stop offset="50%" stop-color="#4C566A"/>
      <stop offset="100%" stop-color="#1E222A"/>
    </linearGradient>
    <filter id="crateCardShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#14330F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#crateCardShadow)">
    <!-- 1. Placa de Madeira Suspensa no Topo -->
    <!-- Cordas de amarração -->
    <line x1="60" y1="5" x2="60" y2="40" stroke="#875E2E" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 2"/>
    <line x1="260" y1="5" x2="260" y2="40" stroke="#875E2E" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 2"/>
    <!-- Placa de madeira com pregos -->
    <rect x="35" y="25" width="250" height="46" rx="8" fill="url(#crateSignWood)" stroke="#502809" stroke-width="3"/>
    <circle cx="50" cy="48" r="3" fill="#2E3440"/>
    <circle cx="270" cy="48" r="3" fill="#2E3440"/>
    <text x="160" y="54" text-anchor="middle" fill="#FEF08A" font-size="14" font-weight="900" letter-spacing="2.5" font-family="sans-serif">
      ★ EXPEDIÇÃO SAFARI ★
    </text>

    <!-- 2. Caixa / Baú de Expedição de Madeira Reforçada no Centro -->
    <rect x="25" y="85" width="270" height="275" rx="18" fill="url(#crateWoodGrad)" stroke="#421E04" stroke-width="4"/>
    
    <!-- Tábuas de madeira horizontais da caixa -->
    <line x1="25" y1="150" x2="295" y2="150" stroke="#3D1B03" stroke-width="3"/>
    <line x1="25" y1="215" x2="295" y2="215" stroke="#3D1B03" stroke-width="3"/>
    <line x1="25" y1="280" x2="295" y2="280" stroke="#3D1B03" stroke-width="3"/>

    <!-- Tábuas cruzadas diagonais (reforço de carga) -->
    <line x1="30" y1="90" x2="290" y2="355" stroke="#3D1B03" stroke-width="5" stroke-dasharray="24 6" opacity="0.35"/>
    <line x1="290" y1="90" x2="30" y2="355" stroke="#3D1B03" stroke-width="5" stroke-dasharray="24 6" opacity="0.35"/>

    <!-- Cantoneiras de ferro e rebites -->
    <rect x="25" y="85" width="38" height="275" fill="url(#ironBandGrad)" opacity="0.9"/>
    <rect x="257" y="85" width="38" height="275" fill="url(#ironBandGrad)" opacity="0.9"/>
    <rect x="25" y="85" width="270" height="26" fill="url(#ironBandGrad)" opacity="0.9"/>
    <rect x="25" y="334" width="270" height="26" fill="url(#ironBandGrad)" opacity="0.9"/>

    <!-- Rebites de aço escovado -->
    <circle cx="44" cy="98" r="4.5" fill="#D8DEE9" stroke="#1E222A" stroke-width="1.2"/>
    <circle cx="276" cy="98" r="4.5" fill="#D8DEE9" stroke="#1E222A" stroke-width="1.2"/>
    <circle cx="44" cy="347" r="4.5" fill="#D8DEE9" stroke="#1E222A" stroke-width="1.2"/>
    <circle cx="276" cy="347" r="4.5" fill="#D8DEE9" stroke="#1E222A" stroke-width="1.2"/>
    <circle cx="44" cy="220" r="4" fill="#D8DEE9" stroke="#1E222A" stroke-width="1.2"/>
    <circle cx="276" cy="220" r="4" fill="#D8DEE9" stroke="#1E222A" stroke-width="1.2"/>
    <circle cx="160" cy="98" r="4" fill="#D8DEE9" stroke="#1E222A" stroke-width="1.2"/>
    <circle cx="160" cy="347" r="4" fill="#D8DEE9" stroke="#1E222A" stroke-width="1.2"/>

    <!-- Selo Central de Expedição com Pegada Gravada a Fogo -->
    <g transform="translate(160, 220)">
      <circle cx="0" cy="0" r="48" fill="#F4E9CE" stroke="#875E2E" stroke-width="4"/>
      <circle cx="0" cy="0" r="42" fill="#E8D5B0" stroke="#875E2E" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- Pegada autoral de dinossauro gravada -->
      <g fill="#784013" transform="translate(-18, -20) scale(1)">
        <ellipse cx="18" cy="24" rx="11" ry="14"/>
        <ellipse cx="7" cy="9" rx="5" ry="8" transform="rotate(-28 7 9)"/>
        <ellipse cx="18" cy="5" rx="5" ry="8"/>
        <ellipse cx="29" cy="9" rx="5" ry="8" transform="rotate(28 29 9)"/>
      </g>
      <!-- Texto do selo circular -->
      <text x="0" y="36" text-anchor="middle" fill="#784013" font-size="8" font-weight="900" letter-spacing="1" font-family="sans-serif">
        CONFIDENCIAL
      </text>
    </g>

    <!-- Folhagens tropicais de selva envolvendo a caixa -->
    <path d="M 15 280 C -12 250, -10 180, 25 170 C 35 210, 45 250, 15 280 Z" fill="#2E6B1D"/>
    <path d="M 305 290 C 332 260, 330 190, 295 180 C 285 220, 275 260, 305 290 Z" fill="#2E6B1D"/>
    <path d="M 20 130 C -5 100, 5 60, 35 70 C 35 90, 30 110, 20 130 Z" fill="#15803D" opacity="0.9"/>
    <path d="M 300 130 C 325 100, 315 60, 285 70 C 285 90, 290 110, 300 130 Z" fill="#15803D" opacity="0.9"/>

    <!-- 3. Botão Entalhado de Abertura na Base -->
    <rect x="55" y="375" width="210" height="44" rx="14" fill="url(#crateSignWood)" stroke="#FEF08A" stroke-width="2.5"/>
    <text x="160" y="402" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="900" letter-spacing="1.5" font-family="sans-serif">
      ABRIR EXPEDIÇÃO 🦖
    </text>
  </g>
</svg>
