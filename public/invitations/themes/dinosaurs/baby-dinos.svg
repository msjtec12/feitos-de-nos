<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- 1. Bebê Brontossauro Amigável (Verde suave com manchas e pescoço longo sorridente) -->
  <g id="baby-bronto" transform="translate(10, 40)">
    <!-- Corpo -->
    <path d="M 40 180 C 40 140, 70 120, 110 130 C 130 90, 120 40, 115 15 C 112 5, 128 -2, 138 2 C 150 7, 152 25, 142 45 C 135 65, 135 110, 145 135 C 175 145, 190 170, 185 200 C 180 225, 160 235, 125 235 C 80 235, 40 220, 40 180 Z" fill="#69B34C"/>
    <!-- Barriguinha clara -->
    <path d="M 60 185 C 60 160, 85 150, 110 155 C 125 158, 140 175, 140 200 C 140 220, 120 230, 95 230 C 75 230, 60 210, 60 185 Z" fill="#C5E898"/>
    <!-- Cabeça e focinho -->
    <ellipse cx="140" cy="12" rx="14" ry="11" fill="#69B34C"/>
    <!-- Olho brilhante feliz -->
    <circle cx="136" cy="9" r="4.5" fill="#1C3D12"/>
    <circle cx="135" cy="8" r="1.5" fill="#FFFFFF"/>
    <!-- Sorriso amigável -->
    <path d="M 143 14 Q 148 18 152 14" stroke="#1C3D12" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Manchas nas costas -->
    <circle cx="85" cy="160" r="6" fill="#4B8C30"/>
    <circle cx="105" cy="150" r="8" fill="#4B8C30"/>
    <circle cx="120" cy="130" r="5" fill="#4B8C30"/>
    <!-- Patinhas fofas -->
    <rect x="55" y="210" width="18" height="30" rx="8" fill="#589B3D"/>
    <rect x="135" y="210" width="18" height="30" rx="8" fill="#589B3D"/>
  </g>

  <!-- 2. Bebê T-Rex Fofinho com Casca de Ovo (Laranja e verde com dente de leite) -->
  <g id="baby-trex" transform="translate(240, 70)">
    <!-- Cauda e Corpo -->
    <path d="M 30 150 C 10 160, -5 180, -15 200 C 5 195, 25 185, 45 180 C 45 195, 60 210, 85 210 C 110 210, 125 190, 120 160 C 115 130, 95 125, 75 125 Z" fill="#52A447"/>
    <!-- Cabeça grandinha e fofa -->
    <path d="M 50 110 C 40 80, 50 50, 80 45 C 115 40, 135 60, 135 85 C 135 110, 115 120, 85 120 Z" fill="#52A447"/>
    <ellipse cx="105" cy="90" rx="16" ry="12" fill="#52A447"/>
    <!-- Olho curioso grande -->
    <circle cx="85" cy="65" r="9" fill="#FFFFFF"/>
    <circle cx="87" cy="65" r="5.5" fill="#1B3A13"/>
    <circle cx="85" cy="63" r="2" fill="#FFFFFF"/>
    <!-- Bochecha rosadinha -->
    <ellipse cx="75" cy="85" rx="7" ry="4" fill="#E67E22" opacity="0.4"/>
    <!-- Sorriso aberto -->
    <path d="M 95 95 Q 110 108 120 95" stroke="#1B3A13" stroke-width="2" stroke-linecap="round"/>
    <!-- Casca de ovo na cabecinha ou ao lado -->
    <path d="M 68 46 L 75 32 L 85 44 L 96 30 L 106 42 L 118 34 L 114 50 Z" fill="#F4E9CE" stroke="#C4B490" stroke-width="2"/>
    <!-- Patinhas da frente pequenas -->
    <path d="M 65 140 Q 80 145 75 152" stroke="#3A7532" stroke-width="4" stroke-linecap="round"/>
    <!-- Pata traseira firme -->
    <ellipse cx="85" cy="205" rx="14" ry="8" fill="#3A7532"/>
  </g>

  <!-- 3. Pequeno Pterodáctilo voando no alto (Tons quentes amarelados/dourados) -->
  <g id="baby-ptero" transform="translate(180, 5) scale(0.8)">
    <path d="M 30 25 C 10 10, -10 15, -25 28 C -5 32, 10 38, 25 35 Z" fill="#F5A623"/>
    <path d="M 35 25 C 55 8, 75 12, 90 24 C 70 30, 55 35, 40 34 Z" fill="#F5A623"/>
    <!-- Corpinho e bico -->
    <ellipse cx="32" cy="28" rx="8" ry="12" fill="#E08E10"/>
    <path d="M 32 20 L 48 24 L 33 26 Z" fill="#F8D065"/>
    <circle cx="30" cy="22" r="2.5" fill="#2E1B05"/>
    <circle cx="29" cy="21" r="0.8" fill="#FFFFFF"/>
  </g>
</svg>
