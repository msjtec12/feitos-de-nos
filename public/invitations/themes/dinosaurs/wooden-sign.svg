<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 110" fill="none">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C48243"/>
      <stop offset="25%" stop-color="#9C5D28"/>
      <stop offset="70%" stop-color="#7E451B"/>
      <stop offset="100%" stop-color="#5A2F11"/>
    </linearGradient>
    <linearGradient id="woodBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2A66B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3E1E08" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8D734A"/>
      <stop offset="50%" stop-color="#D8BE8E"/>
      <stop offset="100%" stop-color="#6C532B"/>
    </linearGradient>
    <filter id="woodShadow" x="-10%" y="-10%" width="130%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#1A0D04" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Cordas de suspensão esquerda e direita -->
  <g stroke="url(#ropeGrad)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="2 4">
    <line x1="85" y1="0" x2="95" y2="35"/>
    <line x1="92" y1="0" x2="102" y2="35"/>
    <line x1="305" y1="0" x2="295" y2="35"/>
    <line x1="312" y1="0" x2="302" y2="35"/>
  </g>
  <ellipse cx="98" cy="35" rx="9" ry="6" fill="#8D734A" stroke="#5A4320" stroke-width="2"/>
  <ellipse cx="298" cy="35" rx="9" ry="6" fill="#8D734A" stroke="#5A4320" stroke-width="2"/>

  <!-- Placa de madeira com bordas talhadas e chanfro -->
  <g filter="url(#woodShadow)">
    <path d="M 50 34 
             C 70 30, 130 33, 200 31 
             C 270 33, 330 30, 350 34 
             C 356 36, 362 45, 360 55 
             C 363 70, 358 85, 352 94 
             C 346 98, 280 96, 200 98 
             C 120 96, 54 98, 48 94 
             C 42 85, 37 70, 40 55 
             C 38 45, 44 36, 50 34 Z" 
          fill="url(#woodGrad)" 
          stroke="url(#woodBevel)" 
          stroke-width="3.5" 
          stroke-linejoin="round"/>

    <path d="M 65 48 Q 180 44 335 48 M 80 62 Q 210 58 320 62 M 60 76 Q 190 73 340 76" 
          stroke="#422008" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          opacity="0.45"/>
    
    <circle cx="62" cy="64" r="3.5" fill="#291A0F" stroke="#684628" stroke-width="1.2"/>
    <circle cx="338" cy="64" r="3.5" fill="#291A0F" stroke="#684628" stroke-width="1.2"/>
  </g>

  <!-- Pegadas de dinossauro -->
  <g fill="#43220A" opacity="0.8" transform="translate(100, 52) scale(0.65)">
    <ellipse cx="14" cy="18" rx="8" ry="10"/>
    <ellipse cx="6" cy="6" rx="3.5" ry="6" transform="rotate(-25 6 6)"/>
    <ellipse cx="14" cy="3" rx="3.5" ry="6"/>
    <ellipse cx="22" cy="6" rx="3.5" ry="6" transform="rotate(25 22 6)"/>
  </g>
  <g fill="#43220A" opacity="0.8" transform="translate(276, 52) scale(0.65)">
    <ellipse cx="14" cy="18" rx="8" ry="10"/>
    <ellipse cx="6" cy="6" rx="3.5" ry="6" transform="rotate(-25 6 6)"/>
    <ellipse cx="14" cy="3" rx="3.5" ry="6"/>
    <ellipse cx="22" cy="6" rx="3.5" ry="6" transform="rotate(25 22 6)"/>
  </g>

  <path d="M 190 30 C 180 20, 192 10, 198 25 C 205 10, 218 18, 208 30 Z" fill="#4B832B"/>
  <path d="M 197 27 L 198 12" stroke="#2D5316" stroke-width="1.2"/>
</svg>
