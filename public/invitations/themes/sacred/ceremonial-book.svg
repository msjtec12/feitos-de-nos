<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none">
  <defs>
    <linearGradient id="sacredBookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="60%" stopColor="#F0FDF4"/>
      <stop offset="100%" stopColor="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="sacredGoldSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB"/>
      <stop offset="50%" stopColor="#FDE68A"/>
      <stop offset="100%" stopColor="#D97706"/>
    </linearGradient>
    <filter id="sacredShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#065F46" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Livro cerimonial sagrado com pomba da paz e ramo de oliveira -->
  <g filter="url(#sacredShadow)">
    <rect x="25" y="30" width="270" height="380" rx="20" fill="url(#sacredBookGrad)" stroke="url(#sacredGoldSoft)" stroke-width="2.5"/>

    <!-- Arco sagrado interno -->
    <path d="M 50 150 
             C 50 80, 160 65, 160 65 
             C 160 65, 270 80, 270 150 
             L 270 380 
             L 50 380 Z" 
          fill="none" 
          stroke="url(#sacredGoldSoft)" 
          stroke-width="1.2" 
          stroke-dasharray="6 3"/>

    <!-- Pomba da paz abstrata voando no centro com ramo no bico -->
    <g transform="translate(160, 190) scale(1.15)">
      <!-- Halo de luz suave -->
      <circle cx="0" cy="0" r="45" fill="#FEF9C3" opacity="0.4"/>
      <circle cx="0" cy="0" r="35" fill="#FFFFFF" stroke="url(#sacredGoldSoft)" stroke-width="1.5"/>

      <!-- Pomba da paz elegante -->
      <path d="M -16 6 
               C -18 -2, -10 -15, 2 -18 
               C 12 -12, 18 2, 8 10 
               C 0 8, -6 12, -16 6 Z" 
            fill="#065F46"/>
      <!-- Asa ascendente -->
      <path d="M -2 -14 C 6 -32, 22 -30, 20 -15 C 14 -12, 6 -12, -2 -14 Z" fill="#047857"/>
      <!-- Raminho de oliveira no bico -->
      <path d="M -16 5 Q -24 3 -28 -2" stroke="#D97706" stroke-width="1.5" fill="none"/>
      <ellipse cx="-26" cy="-2" rx="2.5" ry="1.2" fill="#D97706" transform="rotate(-30 -26 -2)"/>
    </g>

    <!-- Tipografia de bênção -->
    <text x="160" y="275" text-anchor="middle" fill="#D97706" font-size="11" font-weight="700" letter-spacing="2.5" font-family="sans-serif">
      CELEBRAÇÃO CERIMONIAL
    </text>
    <text x="160" y="305" text-anchor="middle" fill="#064E3B" font-size="20" font-family="Playfair Display, serif">
      Paz, Bênção & Afeto
    </text>

    <!-- Botão cerimonial delicado -->
    <rect x="75" y="340" width="170" height="38" rx="19" fill="#065F46"/>
    <text x="160" y="364" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="1.5" font-family="sans-serif">
      ABRIR ESTA BÊNÇÃO
    </text>
  </g>
</svg>
