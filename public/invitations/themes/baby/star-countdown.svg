<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none">
  <defs>
    <!-- Gradiente suave de estrela pastel e nuvem macia -->
    <linearGradient id="starPastel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB"/>
      <stop offset="40%" stopColor="#FEF08A"/>
      <stop offset="100%" stopColor="#FDE68A"/>
    </linearGradient>
    <radialGradient id="cloudBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="70%" stopColor="#F1F5F9"/>
      <stop offset="100%" stopColor="#E2E8F0"/>
    </radialGradient>
    <filter id="babyShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#93C5FD" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Nuvem fofa e macia de base -->
  <g filter="url(#babyShadow)">
    <!-- Nuvem de base -->
    <path d="M 28 115 
             C 16 115, 12 102, 22 96 
             C 18 82, 34 76, 44 84 
             C 52 70, 72 70, 80 84 
             C 90 76, 106 82, 102 96 
             C 112 102, 108 115, 96 115 Z" 
          fill="url(#cloudBase)" 
          stroke="#BFDBFE" 
          stroke-width="1.8"/>

    <!-- Estrela dourada pastel no centro superior -->
    <g transform="translate(60, 54) scale(1.15)">
      <polygon points="0,-36 9,-11 36,-11 14,5 22,30 0,16 -22,30 -14,5 -36,-11 -9,-11" 
               fill="url(#starPastel)" 
               stroke="#FBBF24" 
               stroke-width="2" 
               stroke-linejoin="round"/>
      <!-- Brilho delicado -->
      <circle cx="-5" cy="-8" r="3" fill="#FFFFFF" opacity="0.8"/>
      <!-- Bochechinhas rosadas fofas -->
      <circle cx="-10" cy="5" r="3.5" fill="#F472B6" opacity="0.35"/>
      <circle cx="10" cy="5" r="3.5" fill="#F472B6" opacity="0.35"/>
      <!-- Sorriso suave -->
      <path d="M -4 6 Q 0 9 4 6" stroke="#B45309" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
