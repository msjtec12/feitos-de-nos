    <!-- Estrelinhas nas laterais -->
    <polygon points="-24,0 -22,4 -18,4 -21,7 -19,11 -24,8 -29,11 -27,7 -30,4 -26,4" fill="#BFDBFE"/>
    <polygon points="24,0 26,4 30,4 27,7 29,11 24,8 19,11 21,7 18,4 22,4" fill="#BFDBFE"/>
  </g>
</svg>
