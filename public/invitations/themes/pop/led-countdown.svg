<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none">
  <defs>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#F43F5E"/>
      <stop offset="50%" stopColor="#EC4899"/>
      <stop offset="100%" stopColor="#A855F7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#EC4899" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Painel digital iluminado de concerto neon -->
  <g filter="url(#neonGlow)">
    <!-- Moldura externa do painel LED -->
    <rect x="10" y="15" width="100" height="110" rx="16" fill="#0F172A" stroke="#EC4899" stroke-width="3"/>
    <!-- Grade interna de display -->
    <rect x="16" y="21" width="88" height="98" rx="10" fill="#180B26" stroke="#8B5CF6" stroke-width="1.5"/>

    <!-- Pequenas lâmpadas LED neon no topo -->
    <circle cx="30" cy="28" r="2.5" fill="#22D3EE"/>
    <circle cx="45" cy="28" r="2.5" fill="#EC4899"/>
    <circle cx="60" cy="28" r="2.5" fill="#FACC15"/>
    <circle cx="75" cy="28" r="2.5" fill="#EC4899"/>
    <circle cx="90" cy="28" r="2.5" fill="#22D3EE"/>

    <!-- Barras de equalizador de áudio na base -->
    <g fill="#EC4899" opacity="0.7">
      <rect x="25" y="105" width="6" height="6" rx="1"/>
      <rect x="35" y="101" width="6" height="10" rx="1"/>
      <rect x="45" y="97" width="6" height="14" rx="1"/>
      <rect x="55" y="93" width="6" height="18" rx="1"/>
      <rect x="65" y="97" width="6" height="14" rx="1"/>
      <rect x="75" y="101" width="6" height="10" rx="1"/>
      <rect x="85" y="105" width="6" height="6" rx="1"/>
    </g>
  </g>
</svg>
