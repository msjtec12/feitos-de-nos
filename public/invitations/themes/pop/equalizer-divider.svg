    <rect x="-16" y="-8" width="4" height="16" rx="2" fill="#A855F7"/>
    <rect x="-6" y="-18" width="4" height="36" rx="2" fill="#FACC15"/>
    <rect x="4" y="-14" width="4" height="28" rx="2" fill="#EC4899"/>
    <rect x="14" y="-18" width="4" height="36" rx="2" fill="#22D3EE"/>
    <rect x="24" y="-10" width="4" height="20" rx="2" fill="#A855F7"/>
    <rect x="34" y="-6" width="4" height="12" rx="2" fill="#F472B6"/>
  </g>
</svg>
