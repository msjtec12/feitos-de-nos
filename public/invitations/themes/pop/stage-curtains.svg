<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none">
  <defs>
    <linearGradient id="popStageBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="40%" stop-color="#4A0E4E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="popGlow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#EC4899" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Card Abertura Pop Stage com Neon & Ingressos VIP -->
  <g filter="url(#popGlow)">
    <rect x="20" y="25" width="280" height="390" rx="24" fill="url(#popStageBgGrad)" stroke="#F472B6" stroke-width="3"/>

    <!-- Holofotes de palco -->
    <polygon points="40,25 20,200 100,200" fill="#EC4899" opacity="0.12"/>
    <polygon points="280,25 220,200 300,200" fill="#8B5CF6" opacity="0.15"/>

    <!-- Letreiro Neon Topo -->
    <rect x="50" y="45" width="220" height="32" rx="16" fill="#1E1B4B" stroke="#38BDF8" stroke-width="2"/>
    <text x="160" y="66" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="900" letter-spacing="3" font-family="sans-serif">
      ★ VIP ACCESS ★
    </text>

    <!-- Fones / Disco / Selo Neon Central -->
    <g transform="translate(160, 180)">
      <!-- Disco de vinil estilizado -->
      <circle cx="0" cy="0" r="65" fill="#09090B" stroke="#EC4899" stroke-width="3"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#F472B6" stroke-width="1" opacity="0.4"/>
      <circle cx="0" cy="0" r="35" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
      <circle cx="0" cy="0" r="22" fill="#F43F5E"/>
      <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>

      <!-- Equalizador vertical ao redor -->
      <line x1="-80" y1="-10" x2="-80" y2="10" stroke="#F472B6" stroke-width="3" stroke-linecap="round"/>
      <line x1="-90" y1="-20" x2="-90" y2="20" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
      <line x1="80" y1="-10" x2="80" y2="10" stroke="#F472B6" stroke-width="3" stroke-linecap="round"/>
      <line x1="90" y1="-20" x2="90" y2="20" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="160" y="275" text-anchor="middle" fill="#F472B6" font-size="16" font-weight="900" font-family="sans-serif" letter-spacing="1">
      POP &amp; MUSIC EXPERIENCE
    </text>
    <text x="160" y="295" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600" font-family="sans-serif" opacity="0.85">
      O grande show está prestes a começar
    </text>

    <!-- Botão VIP Entrar no Show -->
    <rect x="55" y="335" width="210" height="46" rx="23" fill="url(#neonPink)" stroke="#FDE047" stroke-width="2"/>
    <text x="160" y="364" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="900" letter-spacing="2" font-family="sans-serif">
      ABRIR CONVITE VIP 🎵
    </text>
  </g>
</svg>
