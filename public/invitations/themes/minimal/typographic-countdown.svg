<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none">
  <!-- Design editorial ultra-limpo com linha fina de 1px e respiro generoso -->
  <rect x="15" y="20" width="90" height="100" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.2"/>
  
  <!-- Linha de detalhe preta superior sólida -->
  <line x1="15" y1="20" x2="45" y2="20" stroke="#18181B" stroke-width="2.5"/>

  <!-- Ponto geométrico de precisão editorial -->
  <rect x="58" y="108" width="4" height="4" fill="#71717A"/>
</svg>
