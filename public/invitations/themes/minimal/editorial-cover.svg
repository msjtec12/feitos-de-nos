<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none">
  <defs>
    <filter id="editorialShadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Capa editorial com grid tipográfico refinado e respiro -->
  <g filter="url(#editorialShadow)">
    <rect x="25" y="30" width="270" height="380" fill="#FAFAFA" stroke="#18181B" stroke-width="1.5"/>

    <!-- Grid suíço: linhas guias discretas -->
    <line x1="45" y1="30" x2="45" y2="410" stroke="#F4F4F5" stroke-width="1"/>
    <line x1="275" y1="30" x2="275" y2="410" stroke="#F4F4F5" stroke-width="1"/>

    <!-- Número do volume / editorial -->
    <text x="50" y="65" fill="#71717A" font-size="10" font-weight="700" letter-spacing="3" font-family="sans-serif">
      VOL. 01 — CONVITE OFICIAL
    </text>

    <!-- Linha horizontal preta fina -->
    <line x1="50" y1="80" x2="270" y2="80" stroke="#18181B" stroke-width="1"/>

    <!-- Título principal com tipografia editorial forte e elegante -->
    <text x="50" y="145" fill="#09090B" font-size="28" font-weight="900" font-family="sans-serif" letter-spacing="-0.5">
      MOMENTO
    </text>
    <text x="50" y="175" fill="#09090B" font-size="28" font-weight="300" font-family="sans-serif" letter-spacing="-0.5">
      ESPECIAL
    </text>

    <text x="50" y="215" fill="#71717A" font-size="11" font-weight="500" font-family="sans-serif" letter-spacing="0.5">
      Uma celebração de vida, presença e afeto.
    </text>

    <!-- Bloco geométrico monocromático de respiro -->
    <rect x="50" y="250" width="220" height="70" fill="#F4F4F5"/>
    <text x="65" y="285" fill="#09090B" font-size="10" font-weight="700" letter-spacing="2" font-family="sans-serif">
      ACESSO EXCLUSIVO
    </text>
    <text x="65" y="302" fill="#71717A" font-size="9" font-family="sans-serif">
      Todos os detalhes do evento a seguir
    </text>

    <!-- Botão editorial limpo -->
    <rect x="50" y="345" width="220" height="40" fill="#09090B"/>
    <text x="160" y="369" text-anchor="middle" fill="#FAFAFA" font-size="10" font-weight="700" letter-spacing="2" font-family="sans-serif">
      LER CONVITE —
    </text>
  </g>
</svg>
