<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none">
  <defs>
    <linearGradient id="partyBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="50%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="curtainGlow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#A855F7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Cortina brilhante de festa e confetes para abertura comemorativa -->
  <g filter="url(#curtainGlow)">
    <rect x="20" y="30" width="280" height="380" rx="24" fill="url(#partyBgGrad)" stroke="#FDE047" stroke-width="3"/>

    <!-- Luzes festivas penduradas no topo -->
    <path d="M 20 50 Q 85 80 160 55 Q 235 80 300 50" stroke="#FDE047" stroke-width="2" fill="none"/>
    <!-- Lâmpadas brilhantes coloridas -->
    <circle cx="50" cy="62" r="5" fill="#F43F5E"/>
    <circle cx="90" cy="72" r="5" fill="#38BDF8"/>
    <circle cx="130" cy="66" r="5" fill="#FACC15"/>
    <circle cx="190" cy="66" r="5" fill="#4ADE80"/>
    <circle cx="230" cy="72" r="5" fill="#F43F5E"/>
    <circle cx="270" cy="62" r="5" fill="#38BDF8"/>

    <!-- Confetes e estrelas metálicas em explosão -->
    <g fill="#FDE047">
      <polygon points="75,120 78,128 86,128 80,133 82,141 75,136 68,141 70,133 64,128 72,128"/>
      <polygon points="245,130 247,136 253,136 248,140 250,146 245,142 240,146 242,140 237,136 243,136"/>
      <polygon points="160,110 163,118 171,118 165,123 167,131 160,126 153,131 155,123 149,118 157,118"/>
    </g>
    <rect x="60" y="160" width="10" height="6" rx="2" fill="#F472B6" transform="rotate(35 60 160)"/>
    <rect x="250" y="180" width="10" height="6" rx="2" fill="#38BDF8" transform="rotate(-40 250 180)"/>
    <rect x="90" y="240" width="8" height="5" rx="1.5" fill="#4ADE80" transform="rotate(20 90 240)"/>
    <rect x="230" y="260" width="8" height="5" rx="1.5" fill="#FACC15" transform="rotate(-25 230 260)"/>

    <!-- Selo central de comemoração -->
    <g transform="translate(160, 200)">
      <circle cx="0" cy="0" r="45" fill="#7C3AED" stroke="#FDE047" stroke-width="3"/>
      <circle cx="0" cy="0" r="38" fill="#581C87" stroke="#FDE047" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="0" y="-8" text-anchor="middle" fill="#FDE047" font-size="11" font-weight="900" letter-spacing="2" font-family="sans-serif">
        CHEGOU A HORA!
      </text>
      <text x="0" y="15" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="900" font-family="sans-serif">
        VAMOS FESTEJAR
      </text>
    </g>

    <!-- Botão de abertura festiva com brilho -->
    <rect x="75" y="340" width="170" height="42" rx="21" fill="#FACC15" stroke="#B45309" stroke-width="2"/>
    <text x="160" y="366" text-anchor="middle" fill="#581C87" font-size="12" font-weight="900" letter-spacing="1.5" font-family="sans-serif">
      ABRIR A FESTA 🎉
    </text>
  </g>
</svg>
