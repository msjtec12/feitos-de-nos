<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none">
  <defs>
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#BE185D"/>
      <stop offset="50%" stopColor="#831843"/>
      <stop offset="100%" stopColor="#500724"/>
    </linearGradient>
    <linearGradient id="bookGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB"/>
      <stop offset="30%" stopColor="#FDE68A"/>
      <stop offset="70%" stopColor="#D97706"/>
      <stop offset="100%" stopColor="#92400E"/>
    </linearGradient>
    <filter id="bookShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#500724" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Livro nobre de contos de fadas com bordas e arabescos dourados -->
  <g filter="url(#bookShadow)">
    <rect x="15" y="15" width="290" height="410" rx="18" fill="url(#bookCoverGrad)" stroke="url(#bookGoldGrad)" stroke-width="4"/>

    <!-- Lombada do livro à esquerda -->
    <rect x="15" y="15" width="30" height="410" rx="4" fill="#500724" opacity="0.6"/>
    <line x1="45" y1="15" x2="45" y2="425" stroke="url(#bookGoldGrad)" stroke-width="2"/>

    <!-- Moldura interna dourada com cantoneiras de arabesco -->
    <rect x="58" y="32" width="232" height="376" rx="10" fill="none" stroke="url(#bookGoldGrad)" stroke-width="2.5" stroke-dasharray="8 4"/>

    <!-- Cantoneiras ornamentais nos 4 cantos -->
    <path d="M 62 55 L 62 36 L 81 36" stroke="url(#bookGoldGrad)" stroke-width="3" fill="none"/>
    <path d="M 286 55 L 286 36 L 267 36" stroke="url(#bookGoldGrad)" stroke-width="3" fill="none"/>
    <path d="M 62 385 L 62 404 L 81 404" stroke="url(#bookGoldGrad)" stroke-width="3" fill="none"/>
    <path d="M 286 385 L 286 404 L 267 404" stroke="url(#bookGoldGrad)" stroke-width="3" fill="none"/>

    <!-- Coroa real no centro superior -->
    <g transform="translate(174, 90) scale(1.3)">
      <path d="M -24 0 L -18 -22 L -6 -8 L 0 -26 L 6 -8 L 18 -22 L 24 0 Z" fill="url(#bookGoldGrad)" stroke="#78350F" stroke-width="1.2"/>
      <circle cx="-18" cy="-22" r="2.5" fill="#FDE68A"/>
      <circle cx="0" cy="-26" r="3" fill="#FDE68A"/>
      <circle cx="18" cy="-22" r="2.5" fill="#FDE68A"/>
    </g>

    <!-- Título do livro gravado a ouro -->
    <text x="174" y="155" text-anchor="middle" fill="#FDE68A" font-size="15" font-family="Playfair Display, serif" font-style="italic">
      Era uma vez...
    </text>
    <text x="174" y="195" text-anchor="middle" fill="#FFFBEB" font-size="24" font-weight="900" font-family="Playfair Display, serif">
      O GRANDE
    </text>
    <text x="174" y="225" text-anchor="middle" fill="#FFFBEB" font-size="24" font-weight="900" font-family="Playfair Display, serif">
      BAILE REAL
    </text>

    <!-- Silhueta de castelo encantado no centro inferior -->
    <g fill="url(#bookGoldGrad)" opacity="0.8" transform="translate(174, 300) scale(0.9)">
      <!-- Torre central e torres laterais -->
      <polygon points="0,-40 -12,-20 12,-20"/>
      <rect x="-10" y="-20" width="20" height="35"/>
      <polygon points="-26,-30 -35,-15 -17,-15"/>
      <rect x="-33" y="-15" width="16" height="30"/>
      <polygon points="26,-30 17,-15 35,-15"/>
      <rect x="17" y="-15" width="16" height="30"/>
      <!-- Portal do castelo -->
      <path d="M -6 15 C -6 6, 6 6, 6 15 Z" fill="#500724"/>
    </g>

    <!-- Botão de abrir o livro -->
    <rect x="95" y="355" width="158" height="36" rx="18" fill="url(#bookGoldGrad)"/>
    <text x="174" y="378" text-anchor="middle" fill="#500724" font-size="12" font-weight="900" font-family="sans-serif">
      ABRIR ESTA HISTÓRIA
    </text>
  </g>
</svg>
