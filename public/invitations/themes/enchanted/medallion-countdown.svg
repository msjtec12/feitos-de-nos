<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none">
  <defs>
    <!-- Ouro nobre facetado e brilhante -->
    <linearGradient id="royalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB"/>
      <stop offset="25%" stopColor="#FDE68A"/>
      <stop offset="60%" stopColor="#D97706"/>
      <stop offset="100%" stopColor="#92400E"/>
    </linearGradient>
    <radialGradient id="medallionBack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FDF2F8"/>
      <stop offset="70%" stopColor="#FCE7F3"/>
      <stop offset="100%" stopColor="#FBCFE8"/>
    </radialGradient>
    <filter id="goldGlow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#B45309" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Medalhão nobre de conto de fadas com tiara no topo -->
  <g filter="url(#goldGlow)">
    <!-- Aro externo decorado com esferas douradas -->
    <circle cx="60" cy="74" r="48" fill="url(#royalGold)"/>
    <circle cx="60" cy="74" r="44" fill="#92400E"/>
    <circle cx="60" cy="74" r="41" fill="url(#medallionBack)" stroke="url(#royalGold)" stroke-width="2"/>

    <!-- Pequenas pérolas / gemas ao redor da moldura -->
    <circle cx="60" cy="27" r="2.5" fill="#FFFBEB"/>
    <circle cx="94" cy="40" r="2.5" fill="#FFFBEB"/>
    <circle cx="107" cy="74" r="2.5" fill="#FFFBEB"/>
    <circle cx="94" cy="108" r="2.5" fill="#FFFBEB"/>
    <circle cx="60" cy="121" r="2.5" fill="#FFFBEB"/>
    <circle cx="26" cy="108" r="2.5" fill="#FFFBEB"/>
    <circle cx="13" cy="74" r="2.5" fill="#FFFBEB"/>
    <circle cx="26" cy="40" r="2.5" fill="#FFFBEB"/>

    <!-- Pequena coroa real no topo do medalhão -->
    <g transform="translate(60, 26)">
      <path d="M -16 0 L -12 -14 L -4 -6 L 0 -18 L 4 -6 L 12 -14 L 16 0 Z" fill="url(#royalGold)" stroke="#78350F" stroke-width="1"/>
      <circle cx="-12" cy="-14" r="1.8" fill="#F43F5E"/>
      <circle cx="0" cy="-18" r="2.2" fill="#3B82F6"/>
      <circle cx="12" cy="-14" r="1.8" fill="#F43F5E"/>
    </g>
  </g>
</svg>
