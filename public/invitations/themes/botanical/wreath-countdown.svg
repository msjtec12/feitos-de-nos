<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none">
  <defs>
    <radialGradient id="botanicalCardBack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </radialGradient>
    <filter id="botanicalShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6D28D9" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Moldura circular cercada por ramos de lavanda e eucalipto -->
  <g filter="url(#botanicalShadow)">
    <circle cx="60" cy="74" r="44" fill="url(#botanicalCardBack)" stroke="#C4B5FD" stroke-width="1.8"/>
    <circle cx="60" cy="74" r="40" fill="none" stroke="#6D28D9" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- Guirlanda de ramos de lavanda ao redor do aro -->
    <!-- Ramo esquerdo -->
    <path d="M 22 80 C 16 55, 30 35, 48 26" stroke="#059669" stroke-width="1.5" fill="none"/>
    <ellipse cx="20" cy="70" rx="3.5" ry="1.8" fill="#7C3AED" transform="rotate(-40 20 70)"/>
    <ellipse cx="24" cy="55" rx="3.5" ry="1.8" fill="#8B5CF6" transform="rotate(-30 24 55)"/>
    <ellipse cx="32" cy="42" rx="3.5" ry="1.8" fill="#A78BFA" transform="rotate(-20 32 42)"/>
    <ellipse cx="44" cy="30" rx="3.5" ry="1.8" fill="#7C3AED" transform="rotate(-10 44 30)"/>

    <!-- Ramo direito -->
    <path d="M 98 80 C 104 55, 90 35, 72 26" stroke="#059669" stroke-width="1.5" fill="none"/>
    <ellipse cx="100" cy="70" rx="3.5" ry="1.8" fill="#7C3AED" transform="rotate(40 100 70)"/>
    <ellipse cx="96" cy="55" rx="3.5" ry="1.8" fill="#8B5CF6" transform="rotate(30 96 55)"/>
    <ellipse cx="88" cy="42" rx="3.5" ry="1.8" fill="#A78BFA" transform="rotate(20 88 42)"/>
    <ellipse cx="76" cy="30" rx="3.5" ry="1.8" fill="#7C3AED" transform="rotate(10 76 30)"/>

    <!-- Laço rústico no topo da guirlanda -->
    <g transform="translate(60, 24)">
      <circle cx="0" cy="0" r="3" fill="#D97706"/>
      <path d="M 0 0 C -6 -8, -14 -4, -8 4 Z" fill="#FDE68A" stroke="#B45309" stroke-width="0.8"/>
      <path d="M 0 0 C 6 -8, 14 -4, 8 4 Z" fill="#FDE68A" stroke="#B45309" stroke-width="0.8"/>
    </g>
  </g>
</svg>
