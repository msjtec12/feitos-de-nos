<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none">
  <defs>
    <!-- Papel Kraft natural / botânico -->
    <linearGradient id="kraftPaper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#F5EBE1"/>
      <stop offset="60%" stopColor="#EAD8C7"/>
      <stop offset="100%" stopColor="#DFC6B1"/>
    </linearGradient>
    <filter id="botanicalEnvShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#4C2882" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Envelope de papel kraft com amarração rústica e ramo de lavanda -->
  <g filter="url(#botanicalEnvShadow)">
    <rect x="20" y="30" width="280" height="380" rx="20" fill="url(#kraftPaper)" stroke="#CBB199" stroke-width="2"/>

    <!-- Dobra do envelope -->
    <path d="M 20 30 L 160 195 L 300 30" stroke="#CBB199" stroke-width="2" fill="none"/>
    <path d="M 20 30 L 160 190 L 300 30 Z" fill="#FAF3ED" opacity="0.5"/>

    <!-- Fio de juta rústico amarrado horizontalmente -->
    <line x1="20" y1="210" x2="300" y2="210" stroke="#8D6B4F" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 2"/>
    <line x1="20" y1="214" x2="300" y2="214" stroke="#5E432D" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Ramo de lavanda natural encaixado na amarração -->
    <g transform="translate(160, 205) rotate(-15)">
      <!-- Haste verde -->
      <path d="M 0 35 L 0 -55" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
      <!-- Flores de lavanda lilás em espiga -->
      <ellipse cx="-4" cy="-50" rx="4" ry="2.2" fill="#7C3AED" transform="rotate(-30 -4 -50)"/>
      <ellipse cx="4" cy="-50" rx="4" ry="2.2" fill="#7C3AED" transform="rotate(30 4 -50)"/>
      <ellipse cx="-4" cy="-40" rx="4.5" ry="2.5" fill="#8B5CF6" transform="rotate(-30 -4 -40)"/>
      <ellipse cx="4" cy="-40" rx="4.5" ry="2.5" fill="#8B5CF6" transform="rotate(30 4 -40)"/>
      <ellipse cx="-4" cy="-30" rx="5" ry="2.8" fill="#7C3AED" transform="rotate(-30 -4 -30)"/>
      <ellipse cx="4" cy="-30" rx="5" ry="2.8" fill="#7C3AED" transform="rotate(30 4 -30)"/>
      <ellipse cx="-4" cy="-20" rx="5" ry="2.8" fill="#8B5CF6" transform="rotate(-30 -4 -20)"/>
      <ellipse cx="4" cy="-20" rx="5" ry="2.8" fill="#8B5CF6" transform="rotate(30 4 -20)"/>
      <!-- Folhinha verde estreita -->
      <path d="M 0 -10 C -12 -15, -16 -5, 0 0 Z" fill="#10B981"/>
      <path d="M 0 5 C 12 0, 16 10, 0 15 Z" fill="#10B981"/>
    </g>

    <!-- Laço de fio de juta no centro -->
    <circle cx="160" cy="210" r="8" fill="#8D6B4F" stroke="#5E432D" stroke-width="1.5"/>

    <!-- Etiqueta botânica artesanal -->
    <rect x="70" y="280" width="180" height="48" rx="8" fill="#FFFDF8" stroke="#CBB199" stroke-width="1.5"/>
    <text x="160" y="302" text-anchor="middle" fill="#6D28D9" font-size="10" font-weight="700" letter-spacing="2" font-family="sans-serif">
      CONVITE BOTÂNICO
    </text>
    <text x="160" y="318" text-anchor="middle" fill="#2E1065" font-size="12" font-family="Playfair Display, serif" font-style="italic">
      Flores, afeto & celebração
    </text>

    <!-- Botão rústico de desatar o nó -->
    <rect x="85" y="350" width="150" height="36" rx="18" fill="#6D28D9"/>
    <text x="160" y="373" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="1" font-family="sans-serif">
      DESATAR O NÓ
    </text>
  </g>
</svg>
